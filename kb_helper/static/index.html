<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB Helper</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#ffffff; --side:#f0efea; --ink:#1f1f1c; --muted:#6f6e66; --line:#e3e2dc;
    --accent:#c96442; --accent-ink:#fff; --accent-soft:#f6e6df; --user:#eceae3; --ask:#fff4e0;
    --ok:#3c9a5f; --warn:#d9a441; --bad:#d64545; --radius:14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151513; --panel:#1e1e1b; --side:#1a1a18; --ink:#ebeae4; --muted:#9d9c93; --line:#2e2e2a;
            --accent:#d9754f; --accent-soft:#3a2a22; --user:#2a2a26; --ask:#3a3020; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  button { font:inherit; cursor:pointer; }
  a { color:var(--accent); }
  .app { display:flex; height:100%; }

  /* ---------- sidebar ---------- */
  .side { width:280px; flex:none; background:var(--side); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px 12px; gap:10px; }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 10px; font-weight:700; font-size:17px; }
  .brand .logo { width:28px; height:28px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:14px; }
  .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:8px 12px; display:inline-flex; align-items:center; gap:8px; }
  .btn:hover { border-color:var(--muted); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover { filter:brightness(.95); }
  .btn.danger { color:var(--bad); }
  .btn.small { padding:4px 9px; font-size:13px; border-radius:8px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.block { width:100%; justify-content:center; }
  .section { margin-top:8px; }
  .section h3 { margin:0 0 6px 8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; }
  .conn { display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:10px; cursor:pointer; }
  .conn:hover { background:rgba(127,127,127,.1); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  .conn .meta { min-width:0; flex:1; }
  .conn .name { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conn .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conn .action { flex:none; }
  .empty-side { color:var(--muted); font-size:13px; padding:4px 8px 8px; }
  .side .grow { flex:1; }
  .side-footer { display:flex; flex-direction:column; gap:6px; }
  .status-line { font-size:12px; color:var(--muted); padding:0 8px; }

  /* ---------- main ---------- */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 22px; border-bottom:1px solid var(--line); background:var(--panel); }
  .topbar .title { font-weight:600; }
  .topbar .hint { color:var(--muted); font-size:13px; }
  .chat { flex:1; overflow-y:auto; padding:24px 0 20px; }
  .chat-inner { max-width:820px; margin:0 auto; padding:0 20px; }
  .welcome { text-align:center; margin:60px auto 30px; max-width:560px; }
  .welcome h2 { margin:0 0 8px; font-size:24px; }
  .welcome p { color:var(--muted); margin:0 0 22px; }
  .setup { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:16px 18px; margin:10px auto; max-width:560px; display:flex; gap:14px; align-items:center; text-align:left; }
  .setup .n { width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; flex:none; }
  .setup .t { flex:1; } .setup .t b { display:block; } .setup .t span { color:var(--muted); font-size:13px; }
  .setup.done .n { background:var(--ok); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px; }
  .chips button { border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:7px 14px; font-size:14px; color:var(--ink); }
  .chips button:hover { border-color:var(--accent); color:var(--accent); }
  .msg { display:flex; flex-direction:column; gap:6px; margin:16px 0; }
  .bubble { padding:12px 16px; border-radius:var(--radius); white-space:pre-wrap; word-wrap:break-word; line-height:1.6; }
  .msg.user .bubble { background:var(--user); align-self:flex-end; max-width:80%; }
  .msg.assistant .bubble { background:var(--panel); border:1px solid var(--line); align-self:flex-start; max-width:100%; }
  .msg.question .bubble { background:var(--ask); }
  .msg.error .bubble { border-color:var(--bad); }
  .bubble code { background:rgba(127,127,127,.15); padding:1px 5px; border-radius:5px; font-size:13px; }
  .bubble pre { background:rgba(127,127,127,.12); padding:10px 12px; border-radius:10px; overflow-x:auto; }
  .options { display:flex; flex-wrap:wrap; gap:8px; }
  .options button { background:var(--accent); color:var(--accent-ink); border:none; padding:7px 14px; border-radius:999px; font-size:14px; }
  .cites, .trace { font-size:12.5px; color:var(--muted); }
  .cites a { text-decoration:none; }
  .thinking { color:var(--muted); font-style:italic; }
  .composer { border-top:1px solid var(--line); background:var(--panel); padding:14px 20px 12px; }
  .composer .row { max-width:820px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea.input { flex:1; resize:none; min-height:50px; max-height:180px; padding:13px 14px; border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font:inherit; }
  textarea.input:focus { outline:none; border-color:var(--accent); }
  .composer .foot { max-width:820px; margin:6px auto 0; font-size:12px; color:var(--muted); }

  /* ---------- modals ---------- */
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:20; padding:20px; }
  .backdrop.open { display:flex; }
  .modal { background:var(--panel); border-radius:16px; width:100%; max-width:600px; max-height:92vh; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); }
  .modal header h2 { margin:0; font-size:17px; }
  .modal .body { padding:18px 20px; display:flex; flex-direction:column; gap:14px; }
  .modal footer { display:flex; gap:8px; justify-content:flex-end; padding:14px 20px; border-top:1px solid var(--line); }
  .modal footer .left { margin-right:auto; }
  .x { background:none; border:none; font-size:20px; color:var(--muted); }
  .field label { display:block; font-weight:600; font-size:13.5px; margin-bottom:5px; }
  .field .help { font-size:12.5px; color:var(--muted); margin-top:4px; }
  .field input[type=text], .field input[type=password], .field select, .field textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); font:inherit; }
  .field textarea { min-height:80px; resize:vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--accent); }
  .field.inline { display:flex; align-items:center; gap:10px; } .field.inline label { margin:0; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .type-card { border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; text-align:left; background:var(--bg); }
  .type-card:hover, .type-card.active { border-color:var(--accent); background:var(--accent-soft); }
  .type-card b { display:block; margin-bottom:4px; } .type-card span { font-size:12.5px; color:var(--muted); }
  .note { border-radius:10px; padding:10px 12px; font-size:13px; background:var(--accent-soft); }
  .note.bad { background:rgba(214,69,69,.12); color:var(--bad); }
  .note.ok { background:rgba(60,154,95,.12); }
  .code { font:600 24px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:3px; margin:8px 0; user-select:all; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; z-index:30; display:none; }
  .toast.show { display:block; }
  @media (max-width: 760px) { .side { display:none; } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">KB</div>KB Helper</div>
    <button class="btn block" id="newChat">＋ New chat</button>
    <div class="section">
      <h3>Connectors</h3>
      <div id="connList"></div>
      <button class="btn block" id="addConn">＋ Add connector</button>
    </div>
    <div class="grow"></div>
    <div class="side-footer">
      <div class="status-line" id="modelLine"></div>
      <button class="btn block" id="openSettings">⚙︎ Settings</button>
    </div>
  </aside>

  <section class="main">
    <div class="topbar"><div class="title">Chat</div><div class="hint" id="topHint"></div></div>
    <div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>
    <form class="composer" id="form">
      <div class="row">
        <textarea class="input" id="input" rows="1" placeholder="Ask e.g. “How do I deploy the pricing service to staging?” or “How do I raise an IT ticket?”"></textarea>
        <button class="btn primary" id="send" type="submit">Send</button>
      </div>
      <div class="foot">Enter to send, Shift+Enter for a new line. Answers come from your connectors; the helper asks when it needs more detail.</div>
    </form>
  </section>
</div>

<!-- Settings modal -->
<div class="backdrop" id="settingsModal">
  <div class="modal">
    <header><h2>Settings</h2><button class="x" data-close="settingsModal">×</button></header>
    <div class="body">
      <div class="field">
        <label>Anthropic API key</label>
        <input type="password" id="sApiKey" placeholder="sk-ant-…" autocomplete="off">
        <div class="help" id="sApiKeyHelp"></div>
      </div>
      <div class="field">
        <label>Model</label>
        <select id="sModel"></select>
      </div>
      <div class="field">
        <label>Effort (quality vs. cost)</label>
        <select id="sEffort"></select>
      </div>
      <div class="field">
        <label>Company-specific instructions (optional)</label>
        <textarea id="sExtra" placeholder="e.g. Our ticketing system is ServiceNow. Default ticket category is IT Service Request."></textarea>
      </div>
      <div class="help" id="sPath"></div>
    </div>
    <footer><button class="btn" data-close="settingsModal">Cancel</button><button class="btn primary" id="sSave">Save</button></footer>
  </div>
</div>

<!-- Connector modal -->
<div class="backdrop" id="connModal">
  <div class="modal">
    <header><h2 id="cTitle">Add connector</h2><button class="x" data-close="connModal">×</button></header>
    <div class="body" id="cBody"></div>
    <footer>
      <div class="left"><button class="btn danger" id="cDelete" style="display:none">Remove</button></div>
      <button class="btn" data-close="connModal">Cancel</button>
      <button class="btn primary" id="cSave">Save</button>
    </footer>
  </div>
</div>

<!-- Sign-in modal -->
<div class="backdrop" id="loginModal">
  <div class="modal" style="max-width:480px">
    <header><h2 id="lTitle">Sign in</h2><button class="x" data-close="loginModal">×</button></header>
    <div class="body" id="lBody"></div>
    <footer><button class="btn" data-close="loginModal">Close</button></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const chatInner = $('chatInner'), chatEl = $('chat'), form = $('form'), input = $('input'), send = $('send');
  let sessionId = null;
  try { sessionId = localStorage.getItem('kb_session') || null; } catch (e) {}
  if (!sessionId) {
    sessionId = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '');
    try { localStorage.setItem('kb_session', sessionId); } catch (e) {}
  }
  let busy = false, settings = null, connectors = [], types = [], hasMessages = false;
  const q = () => '?session_id=' + encodeURIComponent(sessionId);

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(md) {
    let html = esc(md);
    html = html.replace(/```([\s\S]*?)```/g, (_, code) => '<pre>' + code.replace(/^\n/, '') + '</pre>');
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    html = html.replace(/(^|\n)_([^_\n]{2,})_(?=\n|$)/g, '$1<i>$2</i>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return html;
  }
  async function api(method, path, body) {
    const res = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    let data = null;
    const text = await res.text();
    try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { detail: text.slice(0, 300) || res.statusText }; }
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail || data));
    return data;
  }
  let toastTimer;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000); }
  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) { $(id).classList.remove('open'); }
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(b.dataset.close));
  document.querySelectorAll('.backdrop').forEach(b => b.addEventListener('click', e => { if (e.target === b) b.classList.remove('open'); }));
  const scrollDown = () => { chatEl.scrollTop = chatEl.scrollHeight; };

  // ---------- state loading ----------
  async function loadAll() {
    try {
      [settings, connectors, types] = await Promise.all([api('GET', '/api/settings'), api('GET', '/api/connectors' + q()), api('GET', '/api/connector-types')]);
    } catch (err) { toast('Could not load configuration: ' + err.message); return; }
    renderSidebar();
    renderWelcome();
  }
  function statusOf(c) {
    if (!c.enabled) return { cls: '', text: 'Disabled' };
    const s = c.status || {};
    if (s.error && s.error !== 'disabled') return { cls: 'bad', text: s.error };
    if (c.needs_login) return s.signed_in ? { cls: 'ok', text: 'Signed in as ' + (s.account || 'you') } : { cls: 'warn', text: 'Not signed in' };
    if (s.ok === false) return { cls: 'bad', text: s.error || 'Not available' };
    return { cls: 'ok', text: (s.files != null ? s.files + ' files · ' : '') + (c.type_label || c.type) };
  }
  function renderSidebar() {
    const list = $('connList');
    list.innerHTML = '';
    if (!connectors.length) list.innerHTML = '<div class="empty-side">No connectors yet. Add SharePoint or a folder of documents.</div>';
    connectors.forEach(c => {
      const st = statusOf(c);
      const row = document.createElement('div'); row.className = 'conn';
      row.innerHTML = `<div class="dot ${st.cls}"></div><div class="meta"><div class="name">${esc(c.name)}</div><div class="sub" title="${esc(st.text)}">${esc(st.text)}</div></div><div class="action"></div>`;
      row.onclick = () => openConnector(c);
      const action = row.querySelector('.action');
      if (c.enabled && c.needs_login && !(c.status || {}).signed_in) {
        const b = document.createElement('button'); b.className = 'btn small primary'; b.textContent = 'Sign in';
        b.onclick = (e) => { e.stopPropagation(); startLogin(c.name); };
        action.appendChild(b);
      }
      list.appendChild(row);
    });
    $('modelLine').textContent = settings ? (settings.api_key_set ? `Model: ${settings.model} · effort ${settings.effort}` : 'API key not set') : '';
    const ready = settings && settings.api_key_set && connectors.some(c => c.enabled);
    $('topHint').textContent = ready ? '' : 'Finish setup to start chatting';
  }
  function renderWelcome() {
    if (hasMessages) return;
    const keyDone = settings && settings.api_key_set;
    const connDone = connectors.some(c => c.enabled && (c.status || {}).ok !== false);
    const loginNeeded = connectors.filter(c => c.enabled && c.needs_login && !(c.status || {}).signed_in);
    chatInner.innerHTML = `
      <div class="welcome">
        <h2>What do you need to do?</h2>
        <p>Ask how to deploy, how to raise a ticket, who approves what. Answers come from your connected documentation.</p>
        <div class="setup ${keyDone ? 'done' : ''}"><div class="n">${keyDone ? '✓' : '1'}</div><div class="t"><b>Anthropic API key</b><span>${keyDone ? 'Configured (' + esc(settings.api_key_hint) + ')' : 'Needed to talk to Claude.'}</span></div><button class="btn small" id="w1">${keyDone ? 'Change' : 'Add key'}</button></div>
        <div class="setup ${connDone ? 'done' : ''}"><div class="n">${connDone ? '✓' : '2'}</div><div class="t"><b>Knowledge sources</b><span>${connectors.length ? connectors.length + ' connector(s) configured' : 'Connect SharePoint or a folder of documents.'}</span></div><button class="btn small" id="w2">Add</button></div>
        ${loginNeeded.map(c => `<div class="setup"><div class="n">→</div><div class="t"><b>Sign in to ${esc(c.name)}</b><span>Use your own work account; the helper only sees what you can see.</span></div><button class="btn small primary" data-login="${esc(c.name)}">Sign in</button></div>`).join('')}
        ${keyDone && connDone ? `<div class="chips"><button>How do I deploy to staging?</button><button>How do I raise an IT ticket?</button><button>How do I get VPN access?</button></div>` : ''}
      </div>`;
    $('w1').onclick = openSettings;
    $('w2').onclick = () => openConnector(null);
    chatInner.querySelectorAll('[data-login]').forEach(b => b.onclick = () => startLogin(b.dataset.login));
    chatInner.querySelectorAll('.chips button').forEach(b => b.onclick = () => submit(b.textContent));
  }

  // ---------- chat ----------
  function addMessage(role, text, extra) {
    if (!hasMessages) { chatInner.innerHTML = ''; hasMessages = true; }
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role + (extra && extra.kind ? ' ' + extra.kind : '');
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.innerHTML = render(text || '');
    wrap.appendChild(bubble);
    if (extra && extra.events && extra.events.length) {
      const t = document.createElement('div'); t.className = 'trace';
      t.textContent = extra.events.map(e => e.type === 'search' ? `searched “${e.query}”${e.connector ? ' in ' + e.connector : ''}` : `read ${e.document_id}`).join(' · ');
      wrap.appendChild(t);
    }
    if (extra && extra.sources && extra.sources.length) {
      const c = document.createElement('div'); c.className = 'cites';
      c.innerHTML = 'Sources: ' + extra.sources.map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join(' · ');
      wrap.appendChild(c);
    }
    if (extra && extra.options && extra.options.length) {
      const o = document.createElement('div'); o.className = 'options';
      extra.options.forEach(opt => { const b = document.createElement('button'); b.textContent = opt; b.onclick = () => { o.querySelectorAll('button').forEach(x => x.disabled = true); submit(opt); }; o.appendChild(b); });
      wrap.appendChild(o);
    }
    if (extra && extra.setup_required === 'api_key') {
      const b = document.createElement('button'); b.className = 'btn small primary'; b.textContent = 'Open Settings'; b.onclick = openSettings; wrap.appendChild(b);
    }
    chatInner.appendChild(wrap); scrollDown();
    return wrap;
  }
  async function submit(text) {
    if (busy || !text.trim()) return;
    busy = true; send.disabled = true;
    addMessage('user', text);
    const pending = addMessage('assistant', '', {});
    pending.querySelector('.bubble').innerHTML = '<span class="thinking">Searching the knowledge base…</span>';
    try {
      const data = await api('POST', '/api/chat', { message: text, session_id: sessionId });
      pending.remove();
      addMessage('assistant', data.text, data);
      if (data.auth_required && data.auth_required.length) {
        const name = data.auth_required[0];
        const c = connectors.find(x => x.name === name);
        if (c && !(c.status || {}).signed_in) startLogin(name);
      }
    } catch (err) {
      pending.remove();
      addMessage('assistant', 'Something went wrong: ' + err.message, { kind: 'error' });
    } finally { busy = false; send.disabled = false; input.focus(); }
  }
  form.addEventListener('submit', e => { e.preventDefault(); const t = input.value; input.value = ''; input.style.height = 'auto'; submit(t); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 180) + 'px'; });
  $('newChat').onclick = async () => {
    try { await api('POST', '/api/sessions/' + sessionId + '/reset'); } catch (e) {}
    hasMessages = false; renderWelcome(); input.focus();
  };
  async function restore() {
    try {
      const data = await api('GET', '/api/sessions/' + sessionId);
      (data.transcript || []).forEach(m => m.role === 'user' ? addMessage('user', m.text) : addMessage('assistant', m.text, m));
    } catch (e) {}
  }

  // ---------- settings ----------
  function openSettings() {
    if (!settings) return;
    $('sApiKey').value = '';
    $('sApiKey').placeholder = settings.api_key_set ? 'Keep current key (' + settings.api_key_hint + ')' : 'sk-ant-…';
    $('sApiKeyHelp').textContent = settings.api_key_from_env ? 'Currently taken from the ANTHROPIC_API_KEY environment variable; that overrides whatever is saved here.' : 'Get one at console.anthropic.com. Stored in the config file on this machine only.';
    const m = $('sModel'); m.innerHTML = '';
    const ids = settings.models.map(x => x.id);
    settings.models.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.label; m.appendChild(o); });
    if (!ids.includes(settings.model)) { const o = document.createElement('option'); o.value = settings.model; o.textContent = settings.model; m.appendChild(o); }
    m.value = settings.model;
    const ef = $('sEffort'); ef.innerHTML = '';
    settings.efforts.forEach(x => { const o = document.createElement('option'); o.value = x; o.textContent = x; ef.appendChild(o); });
    ef.value = settings.effort;
    $('sExtra').value = settings.extra_instructions || '';
    $('sPath').textContent = 'Saved to ' + settings.config_path;
    openModal('settingsModal');
  }
  $('openSettings').onclick = openSettings;
  $('sSave').onclick = async () => {
    const body = { model: $('sModel').value, effort: $('sEffort').value, extra_instructions: $('sExtra').value };
    const key = $('sApiKey').value.trim();
    if (key) body.api_key = key;
    try { settings = await api('PUT', '/api/settings', body); closeModal('settingsModal'); toast('Settings saved'); await loadAll(); }
    catch (err) { toast('Could not save: ' + err.message); }
  };

  // ---------- connectors ----------
  let editing = null, chosenType = null;
  function openConnector(c) {
    editing = c; chosenType = c ? c.type : null;
    $('cTitle').textContent = c ? 'Edit connector' : 'Add connector';
    $('cDelete').style.display = c ? '' : 'none';
    renderConnectorForm();
    openModal('connModal');
  }
  $('addConn').onclick = () => openConnector(null);
  function typeDef() { return types.find(t => t.type === chosenType); }
  function renderConnectorForm() {
    const body = $('cBody'); body.innerHTML = '';
    if (!editing) {
      const grid = document.createElement('div'); grid.className = 'types';
      types.forEach(t => {
        const card = document.createElement('button'); card.type = 'button'; card.className = 'type-card' + (t.type === chosenType ? ' active' : '');
        card.innerHTML = `<b>${esc(t.label)}</b><span>${esc(t.description)}</span>`;
        card.onclick = () => { chosenType = t.type; renderConnectorForm(); };
        grid.appendChild(card);
      });
      body.appendChild(grid);
      if (!chosenType) return;
    }
    const def = typeDef();
    const opts = editing ? (editing.options || {}) : {};
    const fields = [
      { key: '__name', label: 'Name', type: 'text', required: true, value: editing ? editing.name : (def ? def.label.toLowerCase().split(' ')[0] : ''), help: 'How this source is shown in the chat.' },
      { key: '__description', label: 'What is in it?', type: 'text', value: editing ? editing.description : '', help: 'Tells the assistant what to expect, e.g. “IT runbooks, deployment guides, ticketing docs”.' },
      ...(def ? def.fields : []),
    ];
    const values = {};
    fields.forEach(f => {
      values[f.key] = f.key.startsWith('__') ? f.value : (opts[f.key] !== undefined ? opts[f.key] : (f.default !== undefined ? f.default : ''));
    });
    const wrap = document.createElement('div'); wrap.style.display = 'contents';
    function draw() {
      wrap.innerHTML = '';
      fields.forEach(f => {
        if (f.show_if && Object.entries(f.show_if).some(([k, v]) => (values[k] ?? '') !== v)) return;
        const d = document.createElement('div'); d.className = 'field';
        const lab = document.createElement('label'); lab.textContent = f.label + (f.required ? ' *' : ''); d.appendChild(lab);
        let el;
        if (f.type === 'select') {
          el = document.createElement('select');
          (f.choices || []).forEach(ch => { const o = document.createElement('option'); o.value = ch.value; o.textContent = ch.label; el.appendChild(o); });
          el.value = values[f.key] ?? '';
        } else if (f.type === 'textarea' || f.type === 'list') {
          el = document.createElement('textarea');
          el.value = Array.isArray(values[f.key]) ? values[f.key].join('\n') : (values[f.key] ?? '');
          if (f.type === 'list') el.placeholder = 'One per line';
        } else {
          el = document.createElement('input'); el.type = f.type === 'password' ? 'password' : 'text'; el.autocomplete = 'off';
          el.value = values[f.key] ?? '';
        }
        el.dataset.key = f.key;
        el.oninput = () => { values[f.key] = el.value; };
        el.onchange = () => { values[f.key] = el.value; if (f.type === 'select') draw(); };
        d.appendChild(el);
        if (f.help) { const h = document.createElement('div'); h.className = 'help'; h.textContent = f.help; d.appendChild(h); }
        wrap.appendChild(d);
      });
      if (editing) {
        const d = document.createElement('div'); d.className = 'field inline';
        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = 'cEnabled'; cb.checked = editing.enabled !== false;
        const lab = document.createElement('label'); lab.htmlFor = 'cEnabled'; lab.textContent = 'Enabled';
        d.appendChild(cb); d.appendChild(lab); wrap.appendChild(d);
        if (editing.needs_login) {
          const st = editing.status || {};
          const n = document.createElement('div'); n.className = 'note ' + (st.signed_in ? 'ok' : '');
          n.innerHTML = st.signed_in ? `Signed in as <b>${esc(st.account || 'you')}</b>. ` : 'Not signed in yet. ';
          const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small';
          b.textContent = st.signed_in ? 'Sign out' : 'Sign in now';
          b.onclick = async () => { if (st.signed_in) { await api('POST', `/api/auth/${encodeURIComponent(editing.name)}/signout${q()}`); closeModal('connModal'); loadAll(); } else { closeModal('connModal'); startLogin(editing.name); } };
          n.appendChild(b); wrap.appendChild(n);
        }
        if (editing.status && editing.status.error && editing.status.error !== 'disabled') {
          const n = document.createElement('div'); n.className = 'note bad'; n.textContent = editing.status.error; wrap.appendChild(n);
        }
      }
    }
    draw();
    body.appendChild(wrap);
    body._collect = () => {
      const options = {};
      (def ? def.fields : []).forEach(f => {
        if (f.show_if && Object.entries(f.show_if).some(([k, v]) => (values[k] ?? '') !== v)) return;
        let v = values[f.key];
        if (f.type === 'list') v = String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
        if (v === '' || v === undefined || (Array.isArray(v) && !v.length)) { if (f.required) throw new Error(`${f.label} is required`); return; }
        options[f.key] = v;
      });
      if (!String(values.__name || '').trim()) throw new Error('Name is required');
      const enabled = editing ? ($('cEnabled') ? $('cEnabled').checked : true) : true;
      return { name: String(values.__name).trim(), type: chosenType, description: String(values.__description || '').trim(), enabled, options };
    };
  }
  $('cSave').onclick = async () => {
    let body;
    try { body = $('cBody')._collect(); } catch (err) { toast(err.message); return; }
    try {
      const saved = editing ? await api('PUT', '/api/connectors/' + encodeURIComponent(editing.name), body) : await api('POST', '/api/connectors', body);
      closeModal('connModal');
      await loadAll();
      if (saved.status && saved.status.error && saved.status.error !== 'disabled') toast('Saved, but: ' + saved.status.error);
      else if (saved.needs_login && !(saved.status || {}).signed_in) startLogin(saved.name);
      else toast('Connector saved');
    } catch (err) { toast('Could not save: ' + err.message); }
  };
  $('cDelete').onclick = async () => {
    if (!editing || !confirm(`Remove connector “${editing.name}”?`)) return;
    try { await api('DELETE', '/api/connectors/' + encodeURIComponent(editing.name)); closeModal('connModal'); toast('Connector removed'); await loadAll(); }
    catch (err) { toast('Could not remove: ' + err.message); }
  };

  // ---------- sign-in ----------
  let loginPoll = null;
  async function startLogin(name) {
    clearTimeout(loginPoll);
    $('lTitle').textContent = 'Sign in to ' + name;
    const body = $('lBody');
    body.innerHTML = '<div class="thinking">Contacting Microsoft…</div>';
    openModal('loginModal');
    let info;
    try { info = await api('POST', `/api/auth/${encodeURIComponent(name)}/start${q()}`); }
    catch (err) { body.innerHTML = `<div class="note bad">Could not start sign-in: ${esc(err.message)}</div>`; return; }
    body.innerHTML = `
      <div>Sign in with your normal work account. The helper will only see what your account can see.</div>
      <div class="field"><label>1. Open this link</label><a href="${esc(info.verification_uri)}" target="_blank" rel="noopener">${esc(info.verification_uri)}</a></div>
      <div class="field"><label>2. Enter this code</label><div class="code">${esc(info.user_code)}</div></div>
      <div class="thinking" id="lStatus">Waiting for you to finish signing in…</div>`;
    const poll = async () => {
      try {
        const st = await api('GET', `/api/auth/${encodeURIComponent(name)}/status${q()}`);
        const el = $('lStatus');
        if (st.state === 'signed_in') { if (el) { el.className = 'note ok'; el.textContent = `Signed in as ${st.account}. You can ask your question now.`; } await loadAll(); return; }
        if (st.state === 'error') { if (el) { el.className = 'note bad'; el.textContent = 'Sign-in failed: ' + st.error; } await loadAll(); return; }
      } catch (e) {}
      loginPoll = setTimeout(poll, 3000);
    };
    loginPoll = setTimeout(poll, 3000);
  }

  // ---------- boot ----------
  (async () => { await loadAll(); await restore(); input.focus(); })();
})();
</script>
</body>
</html>
